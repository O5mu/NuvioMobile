name: Build Custom IPA

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned Release IPA (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Release
      KOTLIN_DAEMON_JVMARGS: -Xmx1536M
      NUVIO_GRADLE_JVMARGS: -Xmx5120M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx5120M

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          xcode="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -n 1)"
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      # Only this step sees the keys. local.properties is ignored by git and stays on the runner.
      - name: Create local.properties
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          umask 077
          printf 'TRAKT_CLIENT_ID=%s\nTRAKT_CLIENT_SECRET=%s\nTRAKT_REDIRECT_URI=http://localhost\n' "$TRAKT_CLIENT_ID" "$TRAKT_CLIENT_SECRET" > local.properties

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned IPA
        run: ./scripts/build-ios-ipa.sh

      - name: Encrypt IPA
        env:
          NUVIO_IPA_KEY: ${{ secrets.NUVIO_IPA_KEY }}
        run: |
          test -n "$NUVIO_IPA_KEY"
          for ipa in build/ios-ipa/*.ipa; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -pass env:NUVIO_IPA_KEY -in "$ipa" -out "$ipa.enc"
            rm "$ipa"
          done

      - name: Upload encrypted IPA
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-custom-ipa-${{ matrix.runner }}
          path: build/ios-ipa/*.ipa.enc
          if-no-files-found: error
          retention-days: 30
