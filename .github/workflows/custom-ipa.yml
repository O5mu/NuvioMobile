name: Build Custom IPA

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned Release IPA (${{ matrix.runner }})
    # Apple Silicon runners are often out of capacity, so the Intel runner builds too.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Release
      KOTLIN_DAEMON_JVMARGS: -Xmx1536M
      NUVIO_GRADLE_JVMARGS: -Xmx5120M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx5120M

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          xcode="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -n 1)"
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned IPA
        run: ./scripts/build-ios-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-custom-ipa-${{ matrix.runner }}
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
